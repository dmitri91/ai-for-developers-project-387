name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_CONFIG_CONTENT: '{"permission":{"bash":{"npm install *":"allow","npm i *":"allow","npm ci *":"allow","npx *":"allow","yarn add *":"allow","pnpm add *":"allow","curl *":"allow","wget *":"allow","git clone *":"allow","pip install *":"allow","go get *":"allow"},"external_directory":{"*":"allow"}}}'
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true